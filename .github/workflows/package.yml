name: Package

# Builds the installers for every platform. On a version tag (v1.2.3) it also attaches them
# to a draft GitHub release, which a maintainer reviews and publishes by hand.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
          # macOS packages can only be built on a Mac.
          - os: macos-15
            runtime: osx-arm64
          - os: ubuntu-24.04
            runtime: linux-x64
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK version is pinned in global.json; vpk is pinned in .config/dotnet-tools.json.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build installer
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $arguments = @{ Runtime = $env:RUNTIME }
          if ($env:REF_TYPE -eq 'tag') { $arguments.Version = $env:REF_NAME.TrimStart('v') }
          ./build/package.ps1 @arguments

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.runtime }}
          path: artifacts/installers/${{ matrix.runtime }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # A draft: nothing is public until a maintainer publishes it. The title is the tag.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installers/* --draft --verify-tag --title "$TAG" --generate-notes
